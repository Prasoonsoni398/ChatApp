<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich emerald-to-ocean gradient representing Guftgu -->
    <linearGradient id="guftgu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Gradient for conversation dots -->
    <linearGradient id="dots-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Top glass reflection highlight -->
    <linearGradient id="glass-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft drop shadow for front bubble -->
    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#guftgu-grad)" />
  
  <!-- Subtle glass highlight on top half -->
  <path d="M0 16C0 7.163 7.163 0 16 0H48C56.837 0 64 7.163 64 16V28H0V16Z" fill="url(#glass-sheen)" />

  <!-- Inner border ring -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Secondary / Partner Chat Bubble (top right) -->
  <path d="M38 11C44.627 11 50 15.925 50 22C50 24.3 49.1 26.4 47.6 28.1C48.3 30.1 49.6 31.4 49.8 31.6C50.05 31.85 49.9 32.3 49.5 32.25C47.4 31.9 45.7 30.9 44.6 30.1C42.6 31 40.4 31.6 38 31.6C31.373 31.6 26 26.675 26 20.6C26 14.525 31.373 11 38 11Z" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Primary Chat Bubble (front) -->
  <g filter="url(#bubble-shadow)">
    <path d="M14 23C14 17.477 18.477 13 24 13H36C41.523 13 46 17.477 46 23V33C46 38.523 41.523 43 36 43H25.2L17.2 48.6C16 49.44 14 48.6 14 47.1V43Z" fill="#FFFFFF" />
  </g>

  <!-- 3 Conversation Dots (Guftgu chat indicator) -->
  <circle cx="23" cy="28" r="2.75" fill="url(#dots-grad)" />
  <circle cx="30" cy="28" r="2.75" fill="url(#dots-grad)" />
  <circle cx="37" cy="28" r="2.75" fill="url(#dots-grad)" />
</svg>